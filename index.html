<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTrade Hub | Jual Beli Akun Game Terpercaya</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- NAVBAR --- */
        header {
            background-color: #0b0f19;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }

        .logo i {
            color: #ff5500;
            font-size: 1.5rem;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .nav-links li a:hover {
            color: #ff5500;
        }

        .auth-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-signup {
            background-color: #ff5500;
            color: #fff;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-signup:hover {
            background-color: #e04b00;
        }

        .btn-login {
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.9rem;
        }

        /* --- HERO SECTION --- */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200') center/cover no-repeat;
            padding: 60px 5%;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .search-bar {
            display: flex;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
            gap: 10px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #ffffff;
            color: #0f172a;
            outline: none;
        }

        .btn-filter {
            background-color: #ff5500;
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- MAIN CONTENT LAYOUT --- */
        .container {
            padding: 40px 5%;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-btn-secondary {
            background-color: #1e293b;
            color: #cbd5e1;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            border: 1px solid #334155;
            cursor: pointer;
        }

        /* CARD GRID */
        .grid-listings {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .card-img {
            height: 140px;
            width: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .card-subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .card-price {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .badge-verified {
            font-size: 0.75rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 15px;
        }

        .btn-detail {
            background-color: #0b0f19;
            color: #ffffff;
            text-align: center;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: auto;
            border: 1px solid #334155;
            transition: 0.2s;
        }

        .btn-detail:hover {
            background-color: #ff5500;
            border-color: #ff5500;
        }

        /* --- SIDEBAR --- */
        .sidebar-box {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .mini-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .mini-list-item img {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
        }

        .mini-list-info h4 {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .mini-list-info p {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* --- FEATURES SECTION --- */
        .features {
            background-color: #0b0f19;
            padding: 40px 5%;
            margin-top: 20px;
        }

        .features-title {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #1e293b;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .feature-item i {
            font-size: 1.8rem;
            color: #ffffff;
        }

        .feature-text h4 {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .feature-text p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* --- FOOTER --- */
        footer {
            background-color: #070a10;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #64748b;
            border-top: 1px solid #1e293b;
        }

        .footer-links {
            display: flex;
            gap: 15px;
        }

        .payments {
            display: flex;
            gap: 8px;
        }

        .payment-badge {
            background-color: #1e293b;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <section class="hero">
